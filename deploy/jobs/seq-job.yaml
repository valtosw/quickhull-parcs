apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: workers
      containers:
        - name: sequential
          image: __REGISTRY__/quickhull-sequential:__IMAGE_TAG__
          args: ["--points", "__POINT_COUNT__", "--seed", "__SEED__", "--warmup", "__WARMUP__", "--repetitions", "__REPETITIONS__"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
